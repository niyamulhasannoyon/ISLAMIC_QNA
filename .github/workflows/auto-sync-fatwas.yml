name: Automatic Fatwa Monthly Live Sync

on:
  schedule:
    # Runs on the 1st and 5th of every month at 00:00 UTC (06:00 AM Bangladesh Time)
    - cron: '0 0 1,5 * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI anytime

jobs:
  sync-fatwas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Run Live Incremental Crawler
        env:
          API_URL: ${{ secrets.API_URL || secrets.NEXT_PUBLIC_APP_URL || '' }}
          INGESTION_SECRET_TOKEN: ${{ secrets.INGESTION_SECRET_TOKEN || '' }}
        run: |
          python3 scraper/incremental_scraper.py --source all --max-items 150

      - name: Commit and Push Updated Database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/fatwas.db scraper/scraper_state.json
          if git diff --staged --quiet; then
            echo "No new monthly fatwas discovered. Database is up to date."
          else
            git commit -m "Auto-sync: Ingest monthly fatwas from Al-I'tisam, At-Tahreek & Al-Kawsar"
            git push origin main
          fi
