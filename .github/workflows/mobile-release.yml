name: Mobile Release CI/CD

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit & regression tests
        run: npm test

  build-and-submit:
    name: EAS Build & Submit (${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            submit-cmd: eas submit --platform android --profile production --track internal --non-interactive
          - platform: ios
            submit-cmd: eas submit --platform ios --profile production --non-interactive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Restore Google Service Account Key (Android only)
        if: matrix.platform == 'android' && env.HAVE_PLAY_KEY == 'true'
        env:
          HAVE_PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        run: |
          mkdir -p credentials
          echo "${{ secrets.PLAY_STORE_JSON_KEY }}" > credentials/play-service-account.json

      - name: Restore App Store Connect API Key (iOS only)
        if: matrix.platform == 'ios' && env.HAVE_ASC_KEY == 'true'
        env:
          HAVE_ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
        run: |
          mkdir -p credentials
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 -d > credentials/AuthKey_ASC.p8

      - name: Build Standalone Binary on EAS Cloud
        run: |
          eas build --platform ${{ matrix.platform }} --profile production --non-interactive --wait

      - name: Submit to Store Testing Track (Play Internal / TestFlight)
        run: ${{ matrix.submit-cmd }}
